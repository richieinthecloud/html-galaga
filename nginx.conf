# nginx site configuration for the galaga game. This file replaces the base image's default server block.

server {
    # 8080, not 80. Ports below 1024 are privileged on Linux and binding one
    # requires either root or the NET_BIND_SERVICE capability. Listening high
    # means the container needs neither.
    listen 8080;
    server_name _;

    # Web root -- matches where the Dockerfile copies the game files.
    root /usr/share/nginx/html;
    index index.html;

    # Serve the game. If a path isn't found, fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health-check endpoint for Kubernetes probes.
    #
    # This is what lets the Deployment in the GitOps repo use a real httpGet probe instead of a tcpSocket one. 
    # The difference is meaningful: tcpSocket only proves something holds the port open, while this proves nginx is
    # actually parsing config and serving requests.
    #
    # Returns 200 with no disk access and no log line, so probing it every few seconds costs nothing.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Cache the sprites aggressively; they essentially never change.
    location ~* \.(png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Do NOT cache the game logic. Without this, a browser can hold a stale game.js for a week and you'll deploy a fix that nobody sees
    location ~* \.(js|css|html)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
